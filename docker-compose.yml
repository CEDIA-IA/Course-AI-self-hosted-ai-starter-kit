volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:


networks:
  demo:

x-n8n: &service-n8n
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.31.7}
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}

    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_RUNNERS_ENABLED=true

    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Guayaquil}
    - TZ=${GENERIC_TIMEZONE:-America/Guayaquil}

    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true  

x-ollama: &service-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.32.4}
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.32.4}
  networks: ['demo']
  environment:
    - OLLAMA_HOST=ollama:11434
    - DEFAULT_OLLAMA_MODEL=${DEFAULT_OLLAMA_MODEL:-}
  entrypoint: /bin/sh
  command:
    - "-c"
    - |
      if [ -z "$$DEFAULT_OLLAMA_MODEL" ]; then
        echo 'DEFAULT_OLLAMA_MODEL no esta definido en .env: no se descargara ningun modelo por defecto.'
        exit 0
      fi

      echo 'Esperando a que el servidor de Ollama este listo...'
      tries=0
      until ollama list >/dev/null 2>&1; do
        tries=$$((tries + 1))
        if [ "$$tries" -ge 30 ]; then
          echo 'ERROR: el servidor de Ollama no respondio tras 150s. Revisa que el contenedor ollama este corriendo.'
          exit 1
        fi
        sleep 5
      done

      echo "Servidor listo. Descargando modelo por defecto: $$DEFAULT_OLLAMA_MODEL"
      if ! ollama pull "$$DEFAULT_OLLAMA_MODEL"; then
        echo "ERROR: no se pudo descargar el modelo '$$DEFAULT_OLLAMA_MODEL'."
        echo "Verifica que el tag exista en https://ollama.com/search y que este bien escrito"
        echo "en DEFAULT_OLLAMA_MODEL dentro de tu archivo .env (ej: qwen3.5:2b)."
        exit 1
      fi
      echo "Modelo $$DEFAULT_OLLAMA_MODEL listo."


services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
    - "-c"
    - |
      if [ -z "$(n8n list:workflow --onlyId)" ]; then
        n8n import:credentials --separate --input=/demo-data/credentials && \
        n8n import:workflow --separate --input=/demo-data/workflows
      else
        echo "Workflows exist, skipping import"
      fi
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:${OLLAMA_VERSION_AMD:-0.32.4-rocm}
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-model-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    container_name: ollama-pull-model-cpu
    depends_on:
      - ollama-cpu

  ollama-pull-model-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    container_name: ollama-pull-model-gpu
    depends_on:
      - ollama-gpu

  ollama-pull-model-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    container_name: ollama-pull-model-gpu-amd
    depends_on:
      - ollama-gpu-amd
